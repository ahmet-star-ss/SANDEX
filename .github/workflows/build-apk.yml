name: Build SANDEX APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu indir
        uses: actions/checkout@v4

      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: NPM bağımlılıklarını kur
        run: npm install

      - name: Android platformunu ekle (ilk defa ise)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Web dosyalarını Android projesine senkronize et
        run: npx cap sync android

      - name: Gradle wrapper'a çalıştırma izni ver
        run: chmod +x android/gradlew

      - name: Debug APK derle
        working-directory: android
        run: ./gradlew assembleDebug

      - name: APK'yı çıktı olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: sandex-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
